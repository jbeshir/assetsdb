# packs.yaml — curated manifest for `assetsdb build --manifest packs.yaml --out <db>`.
#
# Each entry is one PackSpec (format.PackSpec: id->ID, name->Name, source->Source, url->URL,
# theme->Theme, tags->Tags, license->License). `source` selects the Ingester ("kenney" or
# "kaykit") that fetches and catalogs the pack.
#
# All packs are CC0-1.0 (public domain) — the ASSETS' license; the assetsdb source is MIT
# (see LICENSE), a separate thing. Kenney: the full catalogue (211 packs) enumerated from
# kenney.nl/assets, every one verified CC0 with a standard direct download. KayKit: all 10
# packs from the KayKit-Game-Assets GitHub user.

